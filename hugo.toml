baseURL = 'https://ylqian.com/'

theme = "LoveIt"

# website title
title = "Yilue's Blog"

# Must stay above the first [table]; anything after a table header belongs to that table.
defaultContentLanguage = "en"

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    # you can add extra information before the name (HTML format is supported), such as icons
    pre = ""
    # you can add extra information after the name (HTML format is supported), such as icons
    post = ""
    name = "Posts"
    url = "/posts/"
    # title will be shown when you hover on this menu link
    title = ""
  [[menu.main]]
    weight = 2
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""
  [[menu.main]]
    weight = 3
    identifier = "categories"
    pre = ""
    post = ""
    name = "Categories"
    url = "/categories/"
    title = ""
  [[menu.main]]
    weight = 4
    identifier = "about"
    pre = ""
    post = ""
    name = "About"
    url = "/about/"
    title = "Professional Background and Experience"

# Markup related configuration in Hugo
[markup]
  # Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
  [markup.highlight]
    # false is a necessary configuration (https://github.com/dillonzq/LoveIt/issues/158)
    noClasses = false

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Generate a language-specific local search index alongside each home page.
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  # site default theme ["auto", "light", "dark"]
  defaultTheme = "auto"
  # Put a content hash in CSS/JS file names (production builds only) so the CDN and
  # browsers fetch new styles right after a deploy instead of serving a cached copy
  # for up to 4 hours. Also adds Subresource Integrity attributes.
  fingerprint = "sha256"

  # Author config
  [params.author]
    name = "Yilue"
    email = "qianyilue@outlook.com"

  # Header config
  [params.header]
    # desktop header mode ["fixed", "normal", "auto"]
    desktopMode = "fixed"
    # mobile header mode ["fixed", "normal", "auto"]
    mobileMode = "auto"
    # Header title config
    [params.header.title]
      # URL of the LOGO
      logo = ""
      # title name, in the head bar
      name = "Yilue's Blog"
      # you can add extra information before the name (HTML format is supported), such as icons
      pre = ""
      # you can add extra information after the name (HTML format is supported), such as icons
      post = ""
      # whether to use typeit animation for title name
      typeit = false

  # Footer config
  [params.footer]
    enable = true
    copyright = true
    author = true
    since = 2025  # This is the start year
    visitorsImage = "https://visitor-badge.laobi.icu/badge?page_id=fqyqc.fqyqc.github.io"

  # Home profile config
  [params.home.profile]
    enable = true
    title = "Yilue's Blog"  # This will be your main title
    subtitle = ""  # Leave this empty to remove "This is my cool site"
    typeit = false
    social = true

  [params.app]
    # modern SVG favicon to use in place of older style .png and .ico files
    svgFavicon = "/favicon.svg"

  [params.page]
    # LoveIt reads extra CSS/JS libraries from params.page.library (merged into each page's params),
    # not from params.library, so they must live here to be loaded.
    [params.page.library.css]
      googleFonts = "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap"
    [params.page.library.js]
      # keep TOC / #hash targets in place while lazy images above them load
      stableAnchor = "js/stable-anchor.js"
      # every click on the theme switch flips light/dark (see the file header)
      themeToggle = "js/theme-toggle.js"
      # desktop language picker styled like the site instead of the native dropdown
      languageMenu = "js/language-menu.js"
    [params.page.toc]
      # whether to enable the table of the contents
      # 是否使用目录
      enable = true
      # whether to keep the static table of the contents in front of the post
      # 是否保持使用文章前面的静态目录
      keepStatic = false
      # whether to make the table of the contents in the sidebar automatically collapsed
      # 是否使侧边目录自动折叠展开
      auto = true

[languages]
  [languages.en]
    weight = 1
    languageCode = "en"
    languageName = "English"
    hasCJKLanguage = false
    copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License."
    [languages.en.menu]
      [[languages.en.menu.main]]
