        name = "About"
        url = "/about/"
        title = ""
      [[languages.en.menu.main]]
        weight = 6
        identifier = "github"
        pre = "<i class='fab fa-github fa-fw' aria-hidden='true'></i>"
        post = ""
        name = ""
        url = "https://github.com/FQYQC/fqyqc.github.io"
        title = "GitHub"
    [languages.en.params]
      [languages.en.params.footer]
        custom = "<a href=\"/friends/\">My friends' websites</a> · <a href=\"/updates/\">Site updates</a>"
      [languages.en.params.search]
        enable = true
        type = "lunr"
        contentLength = 4000
