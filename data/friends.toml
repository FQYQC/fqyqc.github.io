# 友链列表，由 layouts/shortcodes/friends.html 渲染到 /friends/ 和 /zh-cn/friends/。
# 新增朋友时按顺序追加一个 [[friends]] 条目：
#   name 和 url 必填，url 需以 http:// 或 https:// 开头；
#   icon 可选，填 static/ 下的站内路径，图标文件请下载到 static/images/friends/，不要引用对方服务器；
#     没有 icon 时显示名字首字母；
#   iconFill 可选，设为 true 时图标铺满圆形，适合头像照片或细笔画图标；默认留白显示，适合 logo；
#   description 可选，按语言填写 en 和 zh-cn，缺少某种语言时该语言页面不显示简介。
#
# [[friends]]
# name = "Example"
# url = "https://example.com/"
# icon = "/images/friends/example.png"
# description = { en = "One-line intro", zh-cn = "一句话介绍" }

