# 首页封面位，由 layouts/partials/home/featured.html 渲染在个人介绍下方。
# 按顺序列出要突出的文章，建议 1 到 4 篇；1 篇单独显示，2 篇左右并排，3 篇及以上时第一篇为大图、其余排成一行；整个列表留空则首页不显示封面位。
#   page  必填，文章路径，不带语言后缀，如 "/posts/what-ai-brings-us"；
#         某种语言没有这篇文章时，该语言首页自动跳过它。
#   image 可选，填 static/ 下的站内路径；请把压缩后的图片放进 static/images/covers/，
#         不要引用外部图床。没有 image 时显示纯文字封面（大标题 + 摘要）。
#
# [[featured]]
# page = "/posts/example"
# image = "/images/covers/example.jpg"

